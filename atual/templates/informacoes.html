<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Acadêmica Individual</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">Portal Acadêmico</div>
        <ul class="nav-links">
            <li class="active"><a href="/" style="color: inherit; text-decoration: none;">⬅ Voltar ao Painel</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <h1 class="aba-titulo">Prontuário de Informações</h1>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            
            <div class="card">
                <h2 class="card-title" style="color: #3b82f6;">Perfil Geral (Tabela Usuário)</h2>
                <form action="/editar_usuario/{{ usuario[0] }}" method="POST" class="form-grid">
                    <div class="form-group span-4">
                        <label>Nome Completo</label>
                        <input type="text" name="nome" value="{{ usuario[1] }}" required>
                    </div>
                    <div class="form-group span-2">
                        <label>Login de Sistema</label>
                        <input type="text" name="login" value="{{ usuario[5] }}" required>
                    </div>
                    <div class="form-group span-2">
                        <label>CPF (Bloqueado)</label>
                        <input type="text" value="{{ usuario[0] }}" disabled style="background-color: #f1f5f9;">
                    </div>
                    <div class="span-4" style="text-align: right; margin-top: 10px;">
                        <button type="submit" class="btn-submit btn-blue" style="width: 100%;">Atualizar Perfil</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2 class="card-title" style="color: #f59e0b;">Situação e Vínculo Estudantil</h2>
                <div class="form-grid">
                    <div class="form-group span-2">
                        <label>Código de Matrícula</label>
                        <input type="text" value="{{ estudante[0] }}" disabled style="background-color: #f1f5f9;">
                    </div>
                    <div class="form-group span-2">
                        <label>Média de Conclusão (MC)</label>
                        <input type="text" value="{{ estudante[2] }}" disabled style="background-color: #f1f5f9;">
                    </div>
                    <div class="form-group span-4">
                        <label>Curso Atual Ofertado</label>
                        <input type="text" value="{{ estudante[4] }}" disabled style="background-color: #f1f5f9;">
                    </div>
                    
                    <form action="/atualizar_status_vinculo" method="POST" class="span-4" style="display: flex; gap: 15px; align-items: flex-end; margin-top: 10px;">
                        <input type="hidden" name="matricula" value="{{ estudante[0] }}">
                        <div class="form-group" style="flex: 1;">
                            <label>Modificar Status do Vínculo</label>
                            <select name="status_vinculo">
                                <option value="Ativo" {% if estudante[3] == 'Ativo' %}selected{% endif %}>Ativo</option>
                                <option value="Formando" {% if estudante[3] == 'Formando' %}selected{% endif %}>Formando</option>
                                <option value="Graduado" {% if estudante[3] == 'Graduado' %}selected{% endif %}>Graduado</option>
                                <option value="Cancelada" {% if estudante[3] == 'Cancelada' %}selected{% endif %}>Cancelada</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-submit btn-blue" style="background-color: #f59e0b; margin:0;">Salvar Vínculo</button>
                    </form>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
